<script type="text/javascript">
	RED.nodes.registerType('looptimer-advanced', {
		category: 'function',
		color: "#33B2FF",
		defaults: {
			duration: { value: "5", required: true, validate: RED.validators.number() },
			units: { value: "Second" },
			maxloops: { value: "100", required: false, validate: RED.validators.number() },
			maxtimeout: { value: "1", required: false, validate: RED.validators.number() },
			maxtimeoutunits: { value: "Hour" },
			totalcount: { value: false },
			pausecontrol: { value: true },
			name: { value: "" }
		},
		inputs: 1,
		outputs: 2,
		icon: "looptimer_advanced.png",
		label: function () {
			return this.name || this.duration + " " + this.units + " Loop";
		},
		labelStyle: function () {
			return this.name ? "node_label_italic" : "";
		},
		outputLabels: ["original msg", "stopped msg"]
	});
</script>

<script type="text/html" data-template-name="looptimer-advanced">
	<div class="form-row">
		<label for="node-input-duration"><i class="fa fa-clock-o"></i> Loop Every</label>
		<input type="text" id="node-input-duration" style="text-align:end; width:70px !important">
		<select id="node-input-units" style="width:140px !important">
			<option value="Millisecond">Milliseconds</option>
			<option value="Second">Seconds</option>
			<option value="Minute">Minutes</option>
			<option value="Hour">Hours</option>
			<option value="Day">Days</option>
		</select>
	</div>
	<div class="form-row">
		<label for="node-input-maxloops"><i class="fa fa-repeat"></i> Max Loops</label>
		<input type="text" id="node-input-maxloops" style="text-align:end; width:70px !important">
	</div>
	<div class="form-row">
		<label>&nbsp;</label>
		<input type="checkbox" id="node-input-totalcount" style="display:inline-block; width:auto; vertical-align:top;">
		<label for="node-input-totalcount" style="width:auto"> Max Loops counts the first message too</label>
	</div>
	<div class="form-row">
		<label for="node-input-maxtimeout"><i class="fa fa-clock-o"></i> Max Timeout</label>
		<input type="text" id="node-input-maxtimeout" style="text-align:end; width:70px !important">
		<select id="node-input-maxtimeoutunits" style="width:140px !important">
			<option value="Millisecond">Milliseconds</option>
			<option value="Second">Seconds</option>
			<option value="Minute">Minutes</option>
			<option value="Hour">Hours</option>
			<option value="Day">Days</option>
		</select>
	</div>
	<div class="form-row">
		<label>&nbsp;</label>
		<input type="checkbox" id="node-input-pausecontrol" style="display:inline-block; width:auto; vertical-align:top;">
		<label for="node-input-pausecontrol" style="width:auto"> Pause / resume with payload</label>
	</div>
	<div class="form-row">
		<label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
		<input type="text" id="node-input-name" placeholder="Name">
	</div>
</script>

<script type="text/html" data-help-name="looptimer-advanced">
	<p>Sends the <code>msg</code> through the first output, then repeats it once per the configured duration until it is stopped, the maximum number of loops is reached or the maximum timeout expires.</p>

	<h3>Inputs</h3>
	<dl class="message-properties">
		<dt>payload <span class="property-type">string</span></dt>
		<dd><code>stop</code> / <code>STOP</code> stops the loop. If enabled in the node, <code>pause</code> and <code>resume</code> do what they say. Any other message (re)starts the loop.</dd>
		<dt class="optional">loop.command <span class="property-type">string</span></dt>
		<dd><code>stop</code>, <code>pause</code> or <code>resume</code>. Works regardless of the payload and of the "Pause / resume with payload" setting.</dd>
		<dt class="optional">loop.duration, loop.units <span class="property-type">number, string</span></dt>
		<dd>Override the loop interval. Units: <code>Millisecond</code>, <code>Second</code>, <code>Minute</code>, <code>Hour</code>, <code>Day</code>.</dd>
		<dt class="optional">loop.maxtimeout, loop.maxtimeoutunits <span class="property-type">number, string</span></dt>
		<dd>Override the maximum timeout.</dd>
		<dt class="optional">loop.maxloops <span class="property-type">number</span></dt>
		<dd>Override the maximum number of loops.</dd>
		<dt class="optional">loop.totalcount <span class="property-type">boolean</span></dt>
		<dd>Override whether Max Loops counts the first message too.</dd>
	</dl>

	<h3>Outputs</h3>
	<ol class="node-ports">
		<li>The original message, then once per loop. After a pause, the first message carries <code>msg.pauseduration</code> (milliseconds spent paused).</li>
		<li>Status messages with payload <code>stopped</code>, <code>max loops reached</code>, <code>timeout</code>, <code>paused</code> or <code>resumed</code>.</li>
	</ol>

	<h3>Details</h3>
	<p>By default the first message is not part of the loop, so Max Loops <code>5</code> gives <code>6</code> messages. Tick "Max Loops counts the first message too" to get exactly the configured number of messages: <code>1</code> is a single message, <code>0</code> sends nothing and <code>-1</code> is unlimited.</p>
	<p>Pausing freezes the remaining time of the current interval, the loop counter and the timeout budget; resuming continues from there.</p>
	<p>Overrides in <code>msg.loop</code> stay in effect for the following messages.</p>
</script>
