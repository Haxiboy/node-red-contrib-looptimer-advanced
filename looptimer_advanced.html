<script type="text/javascript">
	(function () {
		// Settings can be a number, or a msg., flow., global. or env. value
		function typedNumber(typeField) {
			return function (value) {
				if ((this[typeField] || 'num') !== 'num') { return !!value; }
				return RED.validators.number()(value);
			};
		}
		const numericTypes = ['num', 'msg', 'flow', 'global', 'env'];

		RED.nodes.registerType('looptimer-advanced', {
			category: 'function',
			color: "#33B2FF",
			defaults: {
				duration: { value: "5", required: true, validate: typedNumber('durationType') },
				durationType: { value: "num" },
				units: { value: "Second" },
				maxloops: { value: "100", required: false, validate: typedNumber('maxloopsType') },
				maxloopsType: { value: "num" },
				totalcount: { value: false },
				sendfirst: { value: true },
				maxtimeout: { value: "1", required: false, validate: typedNumber('maxtimeoutType') },
				maxtimeoutType: { value: "num" },
				maxtimeoutunits: { value: "Hour" },
				concurrency: { value: "restart" },
				pausecontrol: { value: true },
				pausetimeout: { value: "", required: false, validate: function (v) { return v === undefined || v === "" || RED.validators.number()(v); } },
				pausetimeoutunits: { value: "Minute" },
				pauseaction: { value: "resume" },
				addstate: { value: false },
				name: { value: "" }
			},
			inputs: 1,
			outputs: 2,
			icon: "looptimer_advanced.png",
			label: function () {
				return this.name || this.duration + " " + this.units + " Loop";
			},
			labelStyle: function () {
				return this.name ? "node_label_italic" : "";
			},
			outputLabels: ["original msg", "status msg"],
			oneditprepare: function () {
				// Nodes saved by earlier versions do not have the newer settings, show the defaults
				const defaults = { durationType: 'num', maxloopsType: 'num', maxtimeoutType: 'num', concurrency: 'restart', pausetimeoutunits: 'Minute', pauseaction: 'resume' };
				Object.keys(defaults).forEach((key) => {
					if (!this[key]) { $('#node-input-' + key).val(defaults[key]); }
				});
				if (this.sendfirst === undefined) { $('#node-input-sendfirst').prop('checked', true); }

				['duration', 'maxloops', 'maxtimeout'].forEach((field) => {
					$('#node-input-' + field).typedInput({
						default: 'num',
						types: numericTypes,
						typeField: '#node-input-' + field + 'Type'
					});
				});
				$('#node-input-duration').typedInput('width', '150px');
				$('#node-input-maxloops').typedInput('width', '150px');
				$('#node-input-maxtimeout').typedInput('width', '150px');
			}
		});
	})();
</script>

<script type="text/html" data-help-name="looptimer-advanced">
	<p>Sends the <code>msg</code> through the first output, then repeats it once per the configured duration until it is stopped, the maximum number of loops is reached or the maximum timeout expires.</p>

	<h3>Inputs</h3>
	<dl class="message-properties">
		<dt>payload <span class="property-type">string</span></dt>
		<dd><code>stop</code> / <code>STOP</code> stops the loop. If enabled in the node, <code>pause</code>, <code>resume</code> and <code>status</code> do what they say. Any other message (re)starts the loop.</dd>
		<dt class="optional">loop.command <span class="property-type">string</span></dt>
		<dd><code>stop</code>, <code>pause</code>, <code>resume</code> or <code>status</code>. Works regardless of the payload and of the "Pause / resume / status with payload" setting.</dd>
		<dt class="optional">loop.all <span class="property-type">boolean</span></dt>
		<dd>With <code>true</code> a command applies to all loops of the node (see "New message" below).</dd>
		<dt class="optional">loop.duration, loop.units <span class="property-type">number, string</span></dt>
		<dd>Override the loop interval, which must be greater than 0. Units: <code>Millisecond</code>, <code>Second</code>, <code>Minute</code>, <code>Hour</code>, <code>Day</code>.</dd>
		<dt class="optional">loop.maxtimeout, loop.maxtimeoutunits <span class="property-type">number, string</span></dt>
		<dd>Override the maximum timeout.</dd>
		<dt class="optional">loop.maxloops <span class="property-type">number</span></dt>
		<dd>Override the maximum number of loops.</dd>
		<dt class="optional">loop.totalcount, loop.sendfirst, loop.loopstate <span class="property-type">boolean</span></dt>
		<dd>Override "Max Loops counts the first message too", "Send the first message immediately" and "Add the loop counters".</dd>
		<dt class="optional">loop.pausetimeout, loop.pausetimeoutunits, loop.pauseaction <span class="property-type">number, string, string</span></dt>
		<dd>Override the pause timeout and what happens after it (<code>resume</code> or <code>stop</code>).</dd>
	</dl>

	<h3>Outputs</h3>
	<ol class="node-ports">
		<li>The original message, then once per loop. After a pause, the first message carries <code>msg.pauseduration</code> (milliseconds spent paused). With "Add the loop counters" every message carries <code>msg.loopstate</code>.</li>
		<li>Status messages with payload <code>stopped</code>, <code>max loops reached</code>, <code>timeout</code>, <code>paused</code>, <code>resumed</code> or <code>status</code>. After an automatic resume or stop <code>msg.reason</code> is <code>pause timeout</code>.</li>
	</ol>

	<h3>msg.loopstate</h3>
	<p><code>state</code> (<code>running</code>, <code>paused</code>, <code>stopped</code>, <code>finished</code> or <code>idle</code>), <code>count</code> (loop messages sent, the first one not included), <code>sent</code> (all messages), <code>max</code> and <code>remaining</code> (<code>null</code> when unlimited), <code>elapsed</code> (milliseconds the loop has been running, the time paused not included) and <code>interval</code> (milliseconds).</p>

	<h3>Details</h3>
	<p><b>Counting.</b> By default the first message is not part of the loop, so Max Loops <code>5</code> gives <code>6</code> messages. Tick "Max Loops counts the first message too" to get exactly the configured number: <code>1</code> is a single message, <code>0</code> sends nothing and <code>-1</code> is unlimited. Without "Send the first message immediately" the first message goes out after the first interval, so Max Loops <code>5</code> gives <code>5</code> messages.</p>
	<p><b>New message.</b> By default a new message restarts the loop. "is ignored while a loop runs" drops it (also its settings) until the loop is over. "starts a separate loop per msg.topic" runs one loop per topic, <code>stop</code>, <code>pause</code>, <code>resume</code> and <code>status</code> then apply to the loop of the topic of the command, or to all loops with <code>msg.loop.all = true</code>.</p>
	<p><b>Pause.</b> Pausing freezes the remaining time of the current interval, the loop counter and the timeout budget. With a pause timeout the loop is resumed or stopped automatically after that time.</p>
	<p><b>Typed settings.</b> Loop Every, Max Loops and Max Timeout can be read from <code>msg.</code>, <code>flow.</code>, <code>global.</code> or <code>env</code> instead of being a fixed number. They are only read for messages that start a loop, commands like <code>stop</code> do not need them. The interval has to be greater than 0.</p>
	<p>Overrides in <code>msg.loop</code> stay in effect for the following messages.</p>
</script>
