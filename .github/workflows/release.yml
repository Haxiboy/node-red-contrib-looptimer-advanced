name: Release

# Stages the package on npm when a GitHub release is published.
# Uses npm trusted publishing (OIDC): no npm token is stored in the repository,
# and the package gets a provenance attestation automatically.
# The staged version goes live only after it is approved on npmjs.com with 2FA.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # needed to request the OIDC token for npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION (expected v$VERSION)"
            exit 1
          fi

      - run: npm ci
      - run: npm test

      # A GitHub pre-release goes to the "next" dist-tag, a normal release to "latest"
      - name: Stage on npm
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm stage publish --tag next
          else
            npm stage publish
          fi
